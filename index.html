<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的留言板</title>
    <style>
        body { max-width: 800px; margin: 20px auto; padding: 20px; font-family: system-ui; }
        .comment-area { margin-bottom: 30px; }
        textarea { width: 100%; padding: 10px; font-size: 16px; }
        input { width: 200px; padding: 8px; margin-right: 10px; font-size: 16px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; }
        .comment-list { margin-top: 20px; }
        .comment-item { border-bottom: 1px solid #ddd; padding: 10px 0; }
        .comment-name { font-weight: bold; color: #007bff; }
        .comment-time { font-size: 12px; color: #999; margin-left: 10px; }
        hr { margin: 20px 0; }
    </style>
</head>
<body>
    <h1>✨ 留言板</h1>
    
    <div class="comment-area">
        <input type="text" id="nameInput" placeholder="你的名字" style="width: 200px;">
        <br><br>
        <textarea id="commentInput" rows="3" placeholder="说点什么吧..." style="width: 100%;"></textarea>
        <br><br>
        <button id="submitBtn">📝 提交留言</button>
    </div>
    
    <hr>
    <h3>📢 历史留言记录</h3>
    
    <div id="commentList" class="comment-list">加载中...</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://phzeluynmdksscuceiwt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ikEv4eGqg3Ik6XO-5FtnAA_5qIsaAc6';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const currentPage = window.location.pathname;

        async function loadComments() {
            document.getElementById('commentList').innerHTML = '加载中...';
            
            const { data, error } = await supabase
                .from('comments')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                document.getElementById('commentList').innerHTML = '加载失败：' + error.message;
                return;
            }
            
            if (data.length === 0) {
                document.getElementById('commentList').innerHTML = '暂无留言，来抢沙发吧！';
                return;
            }
            
            let html = '';
            for (let comment of data) {
                const time = new Date(comment.created_at).toLocaleString();
                html += `
                    <div class="comment-item">
                        <span class="comment-name">${escapeHtml(comment.name)}</span>
                        <span class="comment-time">${time}</span>
                        <p style="margin: 5px 0 0 0;">${escapeHtml(comment.comment)}</p>
                    </div>
                `;
            }
            document.getElementById('commentList').innerHTML = html;
        }
        
        async function submitComment() {
            const name = document.getElementById('nameInput').value.trim();
            const comment = document.getElementById('commentInput').value.trim();
            
            if (!name) {
                alert('请输入你的名字');
                return;
            }
            if (!comment) {
                alert('请输入留言内容');
                return;
            }
            
            const { error } = await supabase
                .from('comments')
                .insert([{ name: name, comment: comment, post_url: currentPage }]);
            
            if (error) {
                alert('提交失败：' + error.message);
                return;
            }
            
            document.getElementById('nameInput').value = '';
            document.getElementById('commentInput').value = '';
            
            loadComments();
            alert('留言成功！');
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        document.getElementById('submitBtn').addEventListener('click', submitComment);
        
        loadComments();
    </script>
</body>
</html>
