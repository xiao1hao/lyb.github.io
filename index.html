<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的留言板</title>
    <style>
        body { max-width: 800px; margin: 20px auto; padding: 20px; font-family: system-ui; }
        .comment-area { margin-bottom: 30px; }
        textarea { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
        input { width: 200px; padding: 8px; font-size: 16px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 6px; }
        button:hover { background: #005fcc; }
        .comment-list { margin-top: 20px; }
        .comment-item { border-bottom: 1px solid #ddd; padding: 12px 0; }
        .comment-name { font-weight: bold; color: #007bff; }
        .comment-time { font-size: 12px; color: #999; margin-left: 10px; }
        hr { margin: 20px 0; }
        .loading { color: #666; text-align: center; padding: 20px; }
        .empty { color: #999; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <h1>✨ 留言板</h1>
    
    <div class="comment-area">
        <input type="text" id="nameInput" placeholder="你的名字">
        <br><br>
        <textarea id="commentInput" rows="3" placeholder="说点什么吧..."></textarea>
        <br><br>
        <button id="submitBtn">📝 提交留言</button>
    </div>
    
    <hr>
    <h3>📢 历史留言记录</h3>
    
    <div id="commentList" class="comment-list">加载中...</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // Supabase 配置
        const SUPABASE_URL = 'https://phzeluynmdksscuceiwt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ikEv4eGqg3Ik6XO-5FtnAA_5qIsaAc6';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const currentPage = window.location.pathname;

        const nameInput = document.getElementById('nameInput');
        const commentInput = document.getElementById('commentInput');
        const submitBtn = document.getElementById('submitBtn');
        const commentList = document.getElementById('commentList');

        // 加载留言
        async function loadComments() {
            commentList.innerHTML = '<div class="loading">加载中...</div>';
            
            const { data, error } = await supabaseClient
                .from('comments')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                commentList.innerHTML = '<div class="empty">加载失败：' + error.message + '</div>';
                console.error('加载错误:', error);
                return;
            }
            
            if (!data || data.length === 0) {
                commentList.innerHTML = '<div class="empty">✨ 暂无留言，来抢沙发吧！</div>';
                return;
            }
            
            let html = '';
            for (let comment of data) {
                const time = new Date(comment.created_at).toLocaleString();
                html += `
                    <div class="comment-item">
                        <span class="comment-name">${escapeHtml(comment.name)}</span>
                        <span class="comment-time">${time}</span>
                        <p style="margin: 8px 0 0 0;">${escapeHtml(comment.comment)}</p>
                    </div>
                `;
            }
            commentList.innerHTML = html;
        }
        
        // 提交留言
        async function submitComment() {
            const name = nameInput.value.trim();
            const comment = commentInput.value.trim();
            
            if (!name) {
                alert('请输入你的名字');
                nameInput.focus();
                return;
            }
            if (!comment) {
                alert('请输入留言内容');
                commentInput.focus();
                return;
            }
            
            // 禁用按钮，防止重复提交
            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';
            
            const { error } = await supabaseClient
                .from('comments')
                .insert([{ name: name, comment: comment, post_url: currentPage }]);
            
            submitBtn.disabled = false;
            submitBtn.textContent = '📝 提交留言';
            
            if (error) {
                alert('提交失败：' + error.message);
                console.error('提交错误:', error);
                return;
            }
            
            // 清空输入框
            nameInput.value = '';
            commentInput.value = '';
            
            // 重新加载留言
            await loadComments();
            
            // 滚动到留言列表顶部
            commentList.scrollIntoView({ behavior: 'smooth' });
        }
        
        // 防止 XSS 攻击
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }
        
        // 绑定事件（只绑定一次）
        submitBtn.addEventListener('click', submitComment);
        
        // 按回车也可以提交（Ctrl+Enter 在 textarea 中发送）
        commentInput.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                submitComment();
            }
        });
        
        // 页面加载时读取留言
        loadComments();
    </script>
</body>
</html>
